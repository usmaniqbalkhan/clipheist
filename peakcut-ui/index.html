<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipHeist</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&family=Inter:wght@300&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#fffa8d;--brand-press:#f5ee6a;--brand-ink:#000000;--brand-soft:#fffde0;--brand-line:#f3ec8a;--brand-deep:#141414;
  --frame:#000000;--frame-2:#1a1a1a;--frame-line:rgba(255,255,255,.1);--frame-text:#ffffff;--frame-dim:#9a9a9a;
  --bg:#FFFFFF;--muted:#f4f4f4;--line:#ececec;--line-2:#cccccc;
  --text:#000000;--dim:#555555;--faint:#9a9a9a;
  --good:#0F8A57;--good-soft:#E6F6EE;--bad:#D3343F;--bad-soft:#FDECEE;--live:#E5323F;
  --r-lg:16px;--r:12px;--r-sm:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:14px/1.5 "Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;fill:currentColor}
::selection{background:var(--brand-line)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button:focus-visible,a:focus-visible,.btn:focus-visible,label:focus-visible,[data-act]:focus-visible{outline:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#E2D9D7;border-radius:999px;border:3px solid #fff}

/* ---------- frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh}
.side{background:var(--frame);color:var(--frame-text);display:flex;flex-direction:column;height:100vh;padding:14px 10px 12px;min-width:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 22px 6px}
.side-head .logo{height:36px;width:auto;display:block}
.side-head .mark{display:none;width:34px;height:34px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);border:0;background:transparent;color:var(--dim);cursor:pointer;flex:none}
.side .icon-btn{color:var(--frame-dim)}
.icon-btn:active{background:var(--muted)}.side .icon-btn:active{background:var(--frame-2)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav h4{font-size:12px;font-weight:500;color:var(--frame-dim);padding:14px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:var(--frame-text);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav-item svg{width:17px;height:17px}
.nav-item svg{color:var(--frame-dim)}
.nav-item:active{background:var(--frame-2)}
.nav-item.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.nav-item.on svg{color:var(--brand-ink)}
.label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--frame-text);white-space:nowrap}
.nav-item.on .count{background:rgba(42,26,18,.14);color:var(--brand-ink)}
.avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,139,51,.18);color:#FFB27A;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
img.avatar{object-fit:cover;background:rgba(255,255,255,.08)}
.tav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--muted)}
#title{display:flex;align-items:center;gap:10px}
.chprev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);animation:rise .25s ease both}
.chprev img,.chprev .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#EFE7E1}
.chprev b{display:block;font-size:14px;color:var(--brand-ink)}
.chprev span{font-size:12px;color:var(--faint)}
.chprev.bad{background:#FDECEC;color:#A12A2A;font-size:13px}
.chprev .sk{width:120px}
.nav-item.on .avatar{background:var(--brand-ink);color:var(--brand)}
.nav-item.on img.avatar{background:var(--brand-ink)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite;flex:none}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--frame-line)}
.side-card{background:var(--frame-2);border-radius:var(--r);padding:12px 14px;margin-top:8px;font-size:12px;color:var(--frame-dim);display:flex;flex-direction:column;gap:7px}
.side-card div{display:flex;align-items:center;gap:9px}
.led{width:7px;height:7px;border-radius:50%;background:#3DDC97;flex:none}.led.no{background:#FF6B78}.led.mid{background:var(--brand)}
.plans-btn{margin-top:10px;width:100%;background:var(--frame-text);color:var(--brand-ink);border:0}
.scrim{display:none}

main{background:var(--bg);margin:8px 8px 8px 0;border-radius:var(--r-lg);height:calc(100vh - 16px);overflow-y:auto;min-width:0;scrollbar-gutter:stable}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 28px;min-height:54px;border-bottom:1px solid transparent;transition:border-color .2s ease}
.topbar.stuck{border-color:var(--line)}
#vbanner:empty{display:none}
.upd{display:grid;gap:14px}
.upd ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--text);max-height:180px;overflow:auto}
.upd ul small{color:var(--dim)}
.upd .cmd{display:flex;gap:8px;align-items:center}
.upd .cmd code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--muted);border-radius:8px;padding:9px 11px}
.upd h3{font-size:13px;font-weight:600;color:var(--brand-ink);margin:0}
.vb{display:flex;align-items:center;gap:12px;margin:12px 28px 0;padding:12px 12px 12px 16px;border-radius:12px;background:#FFF4E6;color:#7A3E0C;font-size:14px;animation:rise .3s ease both}
.vb svg{width:18px;height:18px;flex:none;color:var(--brand-deep)}
.vb span{flex:1;min-width:0}
.vb b{color:#5A2C06}
@media (max-width:640px){.vb{margin:10px 16px 0;flex-wrap:wrap}}
.topbar .titles{flex:1;min-width:0}
#tpic:empty{display:none}
#tpic img,#tpic .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;font-size:15px}
#tpic span.avatar{background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700}
#tpic.live img,#tpic.live .avatar{padding:2px;background:#fff;border:2px solid #E5323F}
.topbar.tabbed{border-color:var(--line)}
.topbar.tabbed .titles{flex:0 1 auto;max-width:34%}
.topbar.tabbed #actions{margin-left:auto}
.utabs:empty{display:none}
.utabs{display:flex;gap:2px;padding:3px;background:var(--muted);border-radius:11px;overflow-x:auto;scrollbar-width:none}
.topbar.tabbed .titles{flex:0 1 auto;max-width:none;min-width:0}.topbar.tabbed .utabs{flex:none;position:relative}
@media (min-width:1400px){.topbar.tabbed{position:sticky}.topbar.tabbed .utabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.topbar.tabbed .titles{max-width:calc(50% - 300px)}}
@media (max-width:760px){.utabs{order:5;flex-basis:100%;margin:2px 0 0;position:relative}.topbar.tabbed .titles{flex:1}.utabs .tabbtn{flex:1;justify-content:center}}
@media (max-width:560px){.utabs .tabbtn{gap:6px;padding:0 8px}.utabs .tabbtn svg{display:none}}
.utabs .tabbtn{height:34px;padding:0 14px;border-radius:8px;background:transparent;color:var(--dim);font-size:13px;transition:background-color .18s ease,color .18s ease}
.utabs .tabbtn:hover{background:#EDE3DB;color:var(--text)}
.utabs .tabbtn::after{display:none}
.utabs .tabbtn.on{background:transparent;color:var(--brand-ink)}
.utabs .tabbtn{position:relative;z-index:1}
.utabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--brand);z-index:0;transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}
.utabs .tabbtn,.utabs .tabbtn svg,.utabs .tabbtn .n{transition:color .25s ease,background-color .25s ease}
.utabs .tabbtn.on svg{color:var(--brand-ink)}
.utabs .tabbtn .n{background:var(--muted);color:var(--dim)}
.utabs .tabbtn.on .n{background:rgba(42,26,18,.14);color:var(--brand-ink)}
.rdot{flex:none;width:9px;height:9px;border-radius:50%;background:#fff}
.btn .rdot.on{background:#E5323F;animation:pulse 1.3s infinite}
/* live stream panel */
.stream{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:14px;background:#1E1612;border-radius:16px;padding:12px;margin-bottom:22px;color:#EFE5DE;animation:rise .3s ease both}
.stream .player{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.stream iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.noembed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:#120D0A;color:#EFE5DE}
.noembed .logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.noembed .logo svg{width:22px;height:22px}
.noembed b{font-size:15px;color:#fff}
.noembed span{font-size:13px;color:#9a9a9a;max-width:380px}
.noembed .btn{margin-top:6px}
.sinfo{display:flex;flex-direction:column;gap:12px;padding:6px 6px 4px 2px;min-width:0}
.sinfo .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinfo .logo{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.sinfo .logo svg{width:16px;height:16px}
.sinfo .lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#E5323F;color:#fff;padding:3px 10px;border-radius:999px}
.sinfo .lv i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.sinfo h3{font-size:16px;line-height:1.4;font-weight:600;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sinfo .by{font-size:12px;color:#9a9a9a;margin-top:-6px}
.sstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.sstats div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px}
.sstats b{display:block;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em}
.sstats span{font-size:11px;color:#9a9a9a}
.sinfo .cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sinfo .cta .btn{height:46px;width:100%;justify-content:center;font-size:15px}
.sinfo .cta small{font-size:12px;color:#9a9a9a;text-align:center}
.splat{display:flex;gap:4px;margin-left:auto}
.splat button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.06);color:#9a9a9a;cursor:pointer;transition:background-color .15s ease}
.splat button:hover{background:rgba(255,255,255,.12)}
.splat button.on{background:rgba(255,139,51,.22)}
.splat svg{width:15px;height:15px}
@media (max-width:960px){.stream{grid-template-columns:1fr}}
.sbadge{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;background:var(--muted);color:var(--dim)}
.sbadge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sbadge.live{background:#FDECEC;color:#C53030}.sbadge.live i,.sbadge.rec i{animation:pulse 1.3s infinite}
.sbadge.rec{background:#E5323F;color:#fff}
.sbadge svg{width:12px;height:12px}
.sbadge{white-space:nowrap;max-width:100%}
.topbar .titles{overflow:hidden}
@media (max-width:560px){#tpic img,#tpic .avatar{width:36px;height:36px}.topbar #actions .btn[data-act=golive]{font-size:0;gap:0;width:38px;padding:0;justify-content:center}.topbar #actions .btn[data-act=golive] .rdot{width:12px;height:12px}}
.ttabs{display:inline-flex;gap:2px;padding:3px;background:var(--muted);border-radius:10px}
.ttabs .tabbtn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--dim)}
.ttabs .tabbtn::after{display:none}
.ttabs .tabbtn svg{width:16px;height:16px}
.ttabs .tabbtn:hover{background:#EDE3DB;color:var(--text)}
.ttabs .tabbtn.on{background:var(--brand-soft);color:var(--brand-ink)}
.ttabs .tabbtn.on .n{background:#fff}
#actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#actions a.btn{text-decoration:none}
@media (max-width:560px){#actions .btn .long{display:none}}
@media (max-width:900px){.ttabs .tabbtn .lbl{display:none}.ttabs .tabbtn{padding:0 10px}}
/* channels in Setup */
.chans{display:flex;flex-direction:column;gap:8px}
.chan{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);min-height:64px}
.chan .logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.chan .logo svg{width:20px;height:20px}
.chan .pic{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;background:#EFE7E1}
.chan .who{flex:1;min-width:0}
.chan .who b{display:block;font-size:14px;color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .who span{font-size:12px;color:var(--faint)}
.chan input{flex:1;min-width:0}
.chan .main{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.chan .main input{accent-color:var(--brand);width:15px;height:15px;flex:none}
.chan .sbadge{margin:0}
@media (max-width:640px){.chan{flex-wrap:wrap}.chan .main{order:5}}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--brand-ink)}
.topbar p{font-size:12px;color:var(--dim);margin-top:0;overflow-wrap:anywhere}
.icon-btn.menu{display:none}
.content{padding:28px 32px 72px;max-width:1280px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* ---------- collapsed sidebar */
.app.mini{grid-template-columns:76px minmax(0,1fr)}
.app.mini .side-head{flex-direction:column;padding:2px 0 18px}
.app.mini .side-head .logo{display:none}.app.mini .side-head .mark{display:block}
.app.mini .label,.app.mini .count,.app.mini .nav h4,.app.mini .side-card,.app.mini .plans-btn,.app.mini .sug-hint,.app.mini .sug-add,.app.mini .nav-item.sug .sb-tag{display:none}
.app.mini .nav-item{justify-content:center;padding:0}
.app.mini .nav-item .live-dot{position:absolute;margin:-20px -22px 0 0}
.avatar.ring{border:2px solid #E5323F;padding:1px;background-clip:content-box}
img.avatar.ring{background:transparent}
.sb-soft{margin-left:auto;font-size:11px;font-weight:600;color:var(--frame-dim,#A99A91);background:rgba(255,255,255,.08);padding:1px 7px;border-radius:5px;white-space:nowrap}
.nav-item.on .sb-soft{background:rgba(42,26,18,.14);color:var(--brand-ink)}
.sb-dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}.sb-dot.ok{background:#22C27A}
.app.mini .sb-soft,.app.mini .sb-dot{display:none}
.sb-tag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#FF8A8A;background:rgba(229,50,63,.16);padding:1px 7px 1px 6px;border-radius:5px}
.sb-tag i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
.sb-tag.rec{background:#E5323F;color:#fff}
.nav-item.on .sb-tag{background:#E5323F;color:#fff}
.app.mini .sb-tag{display:none}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;font-weight:600}
.btn:active{background:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:active{background:var(--brand-press);border-color:var(--brand-press)}
.btn.dark{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.btn.dark svg{color:var(--brand)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;gap:6px}
.btn.sm svg{width:16px;height:16px}
.btn.icon{width:32px;padding:0}
.btn.lg{height:44px;padding:0 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ---------- fields */
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea){width:100%;height:40px;padding:0 12px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-sm);min-width:0;outline:none;transition:border-color .15s ease}
:where(textarea){height:auto;padding:10px 12px;resize:vertical}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):hover{border-color:#D9CCC2}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):focus{background:#fff;border-color:var(--brand)}
input:not([type=checkbox],[type=radio],[type=range]):focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{height:auto;padding:10px 12px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
label.sw{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--text);font-weight:600}
label.sw input{appearance:none;width:38px;height:22px;border-radius:999px;background:#DCD2D0;position:relative;cursor:pointer;flex:none;margin:0}
label.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
label.sw input:checked{background:var(--brand)}label.sw input:checked::after{transform:translateX(16px)}
label.sw small{display:block;color:var(--dim);font-size:12px;font-weight:400}
label.ck{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:var(--r);cursor:pointer;background:#fff;border:1px solid var(--line-2);font-weight:500}
label.ck:has(input:checked){background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
label.ck input{accent-color:var(--brand);margin:0}
[data-caption-style]:disabled{opacity:.45;cursor:default}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.span{grid-column:1/-1}

/* ---------- surfaces */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.card>h2,.card-head h2{font-size:15px;font-weight:600;color:var(--brand-ink)}
.card>h2{margin-bottom:4px}
.card>h2+.help{margin-bottom:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.help,.sub{color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabbtn{position:relative;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:0;background:transparent;color:var(--faint);cursor:pointer;font-weight:600;font-size:14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tabbtn svg{width:17px;height:17px}
.tabbtn .n{font-size:11px;font-weight:600;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--muted);color:var(--dim);text-align:center;transition:background-color .15s ease,color .15s ease}
.tabbtn::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);opacity:0}
.tabbtn.on{color:var(--brand-ink)}
.tabbtn.on::after{opacity:1;animation:tabin .28s ease}
.tabbtn.on .n{background:var(--brand-soft);color:var(--brand-ink)}
.tabbtn.on svg{color:var(--brand)}

.getvid{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--brand-soft)}

.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}

/* ---------- home hero + composer */
.hero{position:relative;padding:32px 28px 34px;text-align:center}
.hero .ga-bg{position:absolute;top:24px;bottom:-40px;left:0;width:100%;pointer-events:none;user-select:none;z-index:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%)}

.hero h2{font-size:clamp(21px,5.2vw,28px);font-weight:700;letter-spacing:-.03em;color:var(--brand-ink);line-height:1.2;text-wrap:balance}

.composer{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg);text-align:left;transition:background-color .15s ease,border-color .15s ease}

.composer :focus-visible{outline:none}
.composer-input{position:relative;display:flex;align-items:center}
.composer-input>svg{position:absolute;left:18px;color:var(--faint);width:20px;height:20px;transition:color .15s ease}
.composer-input:focus-within>svg{color:var(--brand)}
.composer-input input,.composer-input input:focus{height:60px;border:0;background:transparent;padding:0 18px 0 48px;font-size:16px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.composer-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 10px 10px 12px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--muted);color:var(--dim);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.composer.compact .chip{background:#fff}
.chip svg{width:16px;height:16px}
.chip:hover,.chip:focus-visible{background:#EDE3DB;color:var(--text)}
.chip.on,.pick.open .chip{background:var(--brand-soft);color:var(--brand-ink)}
.hint{font-size:12px;color:var(--faint);margin-right:6px}
.composer-bar{flex-wrap:nowrap}
.composer-bar .grow{display:none}
.composer-bar .hint{flex:1 1 0;min-width:0;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:560px){.composer-bar{flex-wrap:wrap}}
.composer-opts{display:none}
.composer-opts.open{display:block}
.composer-opts>.og{padding:0 12px 12px}
/* attachments: link preview and files */
.att{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.att.has{grid-template-rows:1fr}
.att>div{min-height:0;overflow:hidden}
.att-in{display:flex;flex-direction:column;gap:8px;padding:0 12px 8px}
.lp{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:var(--muted);animation:rise .28s ease both}
.composer.compact .lp{background:#fff}
.lp .th{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#2A1A12}
.lp .th img{width:100%;height:100%;object-fit:cover;display:block}
.lp .th .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
.lp .tx{min-width:0;flex:1}
.lp .tx b{display:block;font-size:14px;font-weight:600;color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .tx span{display:block;font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .ok{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#1F7A4D;background:#E3F4EA;padding:4px 10px;border-radius:999px}
.lp .ok svg{width:14px;height:14px}
.lp .ok.live{background:#E5323F;color:#fff}
.lp .ok.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.lp.bad{background:#FDECEC;color:#A12A2A;font-size:13px;padding:10px 12px}
.lp.bad>span{flex:1;min-width:0}
.lp.bad b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#7A1F1F}
.lp.wait .rm{margin-left:auto}
.lp.bad svg{width:16px;height:16px;flex:none}
.lp.wait .th,.sk{background:linear-gradient(90deg,#EFE7E1 0%,#F8F3EF 50%,#EFE7E1 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk{display:block;height:10px;border-radius:6px;margin:4px 0}
.lp{position:relative;overflow:hidden}
.lp .th video{width:100%;height:100%;object-fit:cover;display:block}
.lp .tx em{font-style:normal;color:#A12A2A}
.lp .ok.up{background:var(--brand-soft);color:var(--brand-ink);min-width:52px;justify-content:center}
.lp .rm{flex:none;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.lp .rm:hover,.lp .rm:focus-visible{background:#FDECEC;color:#C53030}
.lp .rm svg{width:14px;height:14px}
.lp .pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);transition:width .2s ease}
.addrow{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s ease,color .15s ease;animation:rise .28s ease both}
.addrow:hover,.addrow:focus-visible{background:var(--brand-soft);color:var(--brand-ink)}
.addrow svg{width:16px;height:16px}
.addrow span{margin-left:auto;font-weight:500;color:var(--faint);font-size:12px}

.btn.primary:disabled{background:#ececec;color:#9a9a9a;cursor:not-allowed}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.working{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--brand);background:rgba(255,139,51,.14);padding:2px 8px 2px 6px;border-radius:999px}

/* custom dropdown: a dark panel, no border or shadow needed against the white */

  opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease,visibility .18s}

img.av{object-fit:cover}
.pick-opt .av,.pick-new .av{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,139,51,.18);color:#FFB27A}
.pick-new .av svg,.pick-opt .av svg{width:14px;height:14px}
.pick-opt .tick{margin-left:auto;width:15px;height:15px;color:var(--brand);visibility:hidden}
.pick-opt[aria-selected=true] .tick{visibility:visible}
.pick-opt[aria-selected=true]{color:#fff}

/* options panel */
.og{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ob{background:var(--muted);border-radius:12px;padding:12px 14px 14px;min-width:0}

.ot{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:10px}

.nstep{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:10px;padding:10px 10px 8px}

.nstep .ctl{display:flex;align-items:center;gap:6px}

.composer.compact .nstep .ctl button{background:#fff}

.nstep input,.nstep input:focus{flex:1;min-width:0;height:30px;padding:0;border:0;background:transparent;text-align:center;font-size:20px;font-weight:700;color:var(--brand-ink);-moz-appearance:textfield}

.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile-o{display:flex;flex-direction:column;gap:7px;padding:6px 6px 8px;border:0;border-radius:10px;background:#fff;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:background-color .15s ease,color .15s ease}
.composer.compact .tile-o{background:var(--muted)}
.tile-o:enabled:hover,.tile-o:focus-visible{background:#EDE3DB;color:var(--text)}

.cap-prev{height:54px;border-radius:7px;background:#1E1612;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-size:14px;line-height:1;color:#fff;letter-spacing:0;-webkit-text-stroke:1px #000;paint-order:stroke fill}

.cpg-note{margin:8px 0 0;font-size:12.5px;line-height:1.45;color:var(--dim)}

.lay-prev.zoom .ph i{left:-6px;right:-6px;height:24px}

.seg{display:flex;gap:4px;background:#fff;border-radius:10px;padding:4px}

.range{display:flex;align-items:center;gap:8px}

.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:var(--r);background:var(--muted);border:0;cursor:pointer}

.stor-path{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.speech-list{display:flex;flex-direction:column;gap:10px}
.speech-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r)}
.speech-info{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}.speech-info .bar{max-width:320px}
.stor-path code{flex:1 1 260px;min-width:0;overflow-wrap:anywhere;font-size:13px;background:var(--muted);border-radius:8px;padding:10px 12px}
.stor-bar{height:10px;border-radius:999px;background:var(--muted);overflow:hidden;margin:14px 0 6px}
.stor-bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.stor-bar.low i{background:var(--bad)}
.stor-nums{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.stor-change{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--muted);display:grid;gap:12px}
.stor-change .with{display:flex;gap:8px}.stor-change .with input{flex:1;min-width:0}
.appsetup{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--muted);display:grid;gap:12px}
.appsetup ol{margin:0;padding-left:18px;font-size:13px;color:var(--text);display:grid;gap:4px}
.appsetup a{color:var(--brand-deep);font-weight:600}
.appsetup a:hover{color:var(--brand-ink)}
.appsetup .copyrow{display:flex;gap:8px;align-items:center}
.appsetup .copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.appsetup .warnline{font-size:12px;color:var(--brand-deep)}
.appact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.applist{display:flex;flex-direction:column;margin:16px 0 -6px;border-top:1px solid var(--line)}
.accrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.accrow+.accrow{border-top:1px solid var(--line)}
.accav{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);font-weight:700;font-size:15px;display:grid;place-items:center;text-transform:uppercase}
.acctx{flex:1;min-width:0}.acctx b{display:block;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acctx span{display:block;font-size:12px;color:var(--faint)}
.accrow .pill.ok i{width:6px;height:6px;border-radius:50%;background:currentColor}
.accrow .btn.ghost{color:var(--dim)}.accrow .btn.ghost:hover{color:var(--bad);background:var(--bad-soft)}
@media (max-width:560px){.apphead{flex-wrap:wrap}.apphead .appact{flex-basis:100%;justify-content:flex-start}.accrow{flex-wrap:wrap;row-gap:6px}.acctx{flex-basis:calc(100% - 48px)}.accrow .pill{margin-left:48px}.accrow .btn{margin-left:auto}}
@media (max-width:860px){.set-layout{grid-template-columns:1fr;gap:16px}.set-nav{position:static;flex-direction:row;overflow-x:auto}.set-link small{display:none}.set-link{flex:none}.kv div{grid-template-columns:1fr;gap:2px}}
.savebar{position:sticky;bottom:16px;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;margin-top:8px;border-radius:14px;background:var(--brand-ink);color:#F4ECE6;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.savebar.on{opacity:1;transform:none;pointer-events:auto}
.savebar>span{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.savebar>span svg{width:16px;height:16px;color:var(--brand)}
.savebar .btn.ghost{color:#E9DED6;background:transparent;border-color:transparent}
.savebar .btn.ghost:hover{background:rgba(255,255,255,.08)}
.step .n{width:26px;height:26px;border-radius:999px;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:var(--brand-ink)}
.step b{display:block;font-weight:600;color:var(--text)}
.step .d{font-size:12px;color:var(--dim)}
.step>svg{color:var(--faint);margin-left:auto}
.allset{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--good-soft);color:var(--good);font-weight:600}

/* ---------- jobs + clips */
.job{margin-bottom:36px}
.job-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.jt{display:flex;gap:14px;align-items:center;min-width:0}
.jthumb{position:relative;flex:none;width:128px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--muted);display:grid;place-items:center;color:var(--faint)}
.jthumb img{width:100%;height:100%;object-fit:cover;display:block}
.jthumb>svg{width:22px;height:22px}
.jthumb .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
@media (max-width:560px){.jthumb{width:92px}}
.job-head h3{font-size:15px;font-weight:600;overflow-wrap:anywhere;color:var(--brand-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;background:var(--muted);border-radius:999px;overflow:hidden;margin:6px 0}
.prog{margin:10px 0 4px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--muted)}
.psteps{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.psteps li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);min-width:0}
.psteps .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psteps .pd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line-2);font-size:11px;font-weight:600;flex:none}
.psteps .pd svg{width:12px;height:12px}
.psteps li.done{color:var(--text)}.psteps li.done .pd{background:#000;color:var(--brand);border-color:#000}
.psteps li.on{color:var(--text);font-weight:600}.psteps li.on .pd{background:var(--brand);border-color:#000}
.spin{width:10px;height:10px;border:2px solid #000;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar.live{height:8px;background:#e4e4e4}
.bar.live i{background:repeating-linear-gradient(-45deg,#000 0 8px,#2a2a2a 8px 16px);background-size:23px 23px;animation:barmove 1s linear infinite}
@keyframes barmove{to{background-position:23px 0}}
.pmeta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim)}
.pstage{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.psteps .pl{display:none}.psteps{grid-template-columns:repeat(5,auto);justify-content:space-between}}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .8s ease}
.err{color:var(--bad);font-size:13px;overflow-wrap:anywhere;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.grid:empty{display:none}.lgrid{margin-bottom:28px}
.clip{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:9/16;background:#17110E;border:0;padding:0;cursor:pointer;display:block;width:100%;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .veil{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.veil span{width:46px;height:46px;border-radius:50%;background:rgba(20,14,11,.55);display:grid;place-items:center;color:#fff;opacity:.85;transition:opacity .15s ease,background-color .15s ease}
.shot:hover .veil span{opacity:1;background:var(--brand);color:var(--brand-ink)}
.veil svg{width:20px;height:20px;margin-left:-1px}
.badge{position:absolute;top:10px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:#fff;color:var(--brand-ink)}
.badge.l{left:10px}.badge.r{right:10px}
.badge.s-hi{background:var(--brand);color:var(--brand-ink)}.badge.s-mid{background:#FFE3CC;color:var(--brand-ink)}
.making{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--dim);font-size:13px;font-weight:500;background:linear-gradient(110deg,#F4EFEE 30%,#FBF8F7 50%,#F4EFEE 70%);background-size:220% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.clip-body{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}
.hook{font-weight:600;font-size:13px;color:var(--brand-ink)}
.ttl{color:var(--dim);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.selck{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;cursor:pointer;flex:none;transition:background-color .15s ease}
.selck:hover{background:var(--brand-soft)}
.selck input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;margin:0}
.clip.picked{border-color:var(--brand)}
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 24px);padding:10px 12px 10px 18px;border-radius:14px;background:#1F140D;color:#FFF4EA;font-size:14px;border:1px solid rgba(255,178,122,.25)}
#selbar.on{display:flex}
#selbar b{font-weight:700;margin-right:6px}
#selbar .btn{background:transparent;color:#FFF4EA;border-color:rgba(255,244,234,.25)}
#selbar .btn:hover{background:rgba(255,244,234,.1)}
#selbar .btn.primary{background:var(--brand);color:#1F140D;border-color:var(--brand)}
#selbar .btn.primary:hover{background:#f5ee6a}
#selbar .btn.danger{color:#FF9A8F;border-color:rgba(255,154,143,.45)}
#selbar .btn.danger:hover{background:rgba(255,154,143,.14)}
.danger-card{border-color:#F3C9C4}
.danger-card h2{color:var(--bad)}
.clip-foot{display:flex;gap:2px;align-items:center;margin-top:auto;padding-top:8px;min-width:0}
.clip-foot .btn.icon{width:30px;height:30px;padding:0;flex:none}.clip-foot .btn:not(.icon){height:30px;padding:0 10px;flex:none;font-size:13px}.clip-foot .btn:not(.icon) svg{width:14px;height:14px}
.clip{min-width:0}

/* ---------- live */
.livecard{background:#fff;border:1px solid #F4C9CD;border-radius:var(--r);padding:20px;margin-bottom:28px}
.lc-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.lc-title{flex:1;min-width:0}
.lc-title h3{margin-top:8px;font-size:16px;line-height:1.4;color:var(--brand-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lc-acts{flex:none;display:flex;gap:8px;align-items:center}
.lc-acts .btn{height:40px}
@media (max-width:900px){.lc-head{flex-direction:column}.lc-acts{width:100%}.lc-acts .btn{flex:1;justify-content:center}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}
.stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.evbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 0;border:0;background:transparent;font:inherit;font-size:20px;font-weight:600;color:var(--brand-ink);cursor:pointer;border-radius:8px;transition:color .15s ease}
.evbtn:hover,.evpick.open .evbtn{color:var(--brand)}
.evbtn .car{width:14px;height:14px;color:var(--faint)}
.evpick .pick-menu{min-width:240px}
.pick-opt .ph{font-size:11px;color:#9C8A7E;margin-left:6px}
.stat .evpick .pick-opt .pl{font-size:13px;color:inherit}.stat .evpick .pick-opt .ph{font-size:11px;color:#9C8A7E}.stat .evpick .evbtn .pv{font-size:20px;color:inherit}
.autonote{font-size:12px;color:var(--faint);margin:-8px 0 14px}.stat span{font-size:12px;color:var(--dim)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.meter{background:var(--muted);border-radius:var(--r);padding:12px 14px}
.meter h4{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:9px}
.spark{display:flex;align-items:flex-end;gap:2px;height:46px}
.spark i{flex:1;height:0;background:var(--brand);border-radius:2px 2px 0 0;transition:height .6s cubic-bezier(.2,.7,.2,1)}.spark.chat i{background:var(--good)}
.spark i.e{background:#E9E1DA}
[data-l="said"] div:last-child,[data-l="verdicts"] div:first-child{animation:said-in .35s ease}
@keyframes said-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.spark i{transition:none}.said div{animation:none!important}}
.said{font-size:13px;color:var(--faint);height:76px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.said div:last-child{color:var(--text)}

/* ---------- tables + logs */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--faint);padding:0 10px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
a.lnk{color:var(--brand-ink);text-decoration:none;font-weight:600}
.log{display:flex;flex-direction:column}
.log div{display:flex;gap:14px;padding:11px 0;font-size:13px}
.log div+div{border-top:1px solid var(--line)}
.log time{color:var(--faint);white-space:nowrap;flex:none;width:118px}

/* ---------- plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:var(--r);background:#fff;border:1px solid var(--line-2);cursor:pointer;font-size:13px;color:var(--dim)}
.plan b{font-size:16px;font-weight:600;color:var(--brand-ink);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.plan b svg{color:var(--brand)}
.plan em{position:absolute;top:16px;right:16px;font-style:normal;font-size:11px;font-weight:600;background:var(--brand-ink);color:var(--brand);padding:2px 8px;border-radius:999px}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan.on{background:var(--brand-soft);border-color:var(--brand)}
.plan:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}

/* ---------- dialogs + toasts */
dialog{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:var(--r-lg);padding:0;max-width:calc(100vw - 32px)}
dialog::backdrop{background:rgba(14,12,11,.42);animation:fadein .16s ease}
.dlg{padding:24px;width:450px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:18px;font-weight:600;color:var(--brand-ink)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.editor{display:grid;grid-template-columns:minmax(240px,340px) minmax(300px,450px);max-height:calc(100vh - 48px)}
.editor .stage{background:#17110E;display:grid;place-items:center;position:relative;min-height:320px}
.editor video,.editor .stage img{width:100%;max-height:calc(100vh - 48px);aspect-ratio:9/16;object-fit:contain;display:block}
.editor .panel{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.editor h3{font-size:13px;font-weight:600;color:var(--dim);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
#toasts[popover]{inset:auto 20px 20px auto;margin:0;border:0;padding:0;background:transparent;overflow:visible;color:inherit}
.toast{background:var(--frame);color:var(--frame-text);border:1px solid var(--frame-2);border-radius:var(--r);padding:12px 16px;max-width:380px;animation:rise .2s ease;display:flex;gap:10px;align-items:center;font-weight:500}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.toast.ok::before{background:#3DDC97}.toast.bad::before{background:#FF6B78}
.toast .rep{margin-left:auto;border:0;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.toast .rep:hover{background:rgba(255,255,255,.18)}
.err .rep{margin-left:8px;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}

.ntoast{display:flex;gap:12px;align-items:flex-start;width:340px;max-width:calc(100vw - 40px);padding:12px 12px 12px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--text);cursor:pointer;text-align:left;
  animation:ntin .35s cubic-bezier(.2,.8,.2,1) both;transition:background-color .15s ease}
.ntoast:hover{background:#FFFBF8}
.ntoast.out{animation:ntout .25s ease forwards}
.ntoast i{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.ntoast i svg{width:17px;height:17px}
.ntoast.k-post i{background:#FDECEC;color:#C53030}.ntoast.k-live i{background:#FDECEC;color:#E5323F}.ntoast.k-clips i{background:#E9F6EE;color:#1F7A4D}
.ntoast .tx{flex:1;min-width:0}
.ntoast b{display:block;font-size:13px;font-weight:600;color:var(--brand-ink);line-height:1.35}
.ntoast span{display:block;font-size:12px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.ntoast .x{flex:none;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer}
.ntoast .x:hover{background:var(--muted);color:var(--text)}
.ntoast .x svg{width:12px;height:12px}
@keyframes ntin{from{opacity:0;transform:translateX(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ntout{to{opacity:0;transform:translateX(24px)}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}

.me{display:flex;align-items:center;gap:8px;padding:10px 2px 0 6px;margin-top:8px;border-top:1px solid var(--frame-line)}
.me .me-pic{width:30px;height:30px;font-size:14px;object-fit:cover;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.me-btn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:4px;margin:-4px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;cursor:pointer;transition:background-color .15s ease}
.me-btn:hover,.me-btn[aria-expanded=true]{background:var(--frame-2)}
.bell{position:relative}
.bell .dotn{position:absolute;top:2px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#E5323F;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--frame)}
.pop{position:fixed;z-index:60;left:248px;bottom:12px;width:360px;max-width:calc(100vw - 24px);max-height:min(520px,calc(100vh - 100px));display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  opacity:0;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease}
.pop.open{opacity:1;transform:none}
@media (max-width:900px){.pop{left:12px!important;bottom:74px!important;z-index:80}}
.pop-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.pop-head h3{font-size:15px;color:var(--brand-ink);flex:1}
.pop-head button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px}
.pop-head button:hover{color:var(--brand-ink);background:var(--muted)}
.pop-list{overflow-y:auto;padding:0 6px 6px;scrollbar-width:none}.sch-tcol::-webkit-scrollbar{display:none}
.nt{display:flex;gap:12px;width:100%;padding:10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer;transition:background-color .15s ease}
.nt:hover{background:var(--muted)}
.nt i{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.nt i svg{width:16px;height:16px}
.nt.k-post i,.nt.k-fail i{background:#FDECEC;color:#C53030}.nt.k-live i{background:#FDECEC;color:#E5323F}.nt.k-clips i{background:#E9F6EE;color:#1F7A4D}
.nt .tx{flex:1;min-width:0}
.nt b{display:block;font-size:13px;font-weight:600;color:var(--brand-ink);line-height:1.35}
.nt span{display:block;font-size:12px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.nt small{display:block;font-size:11px;color:var(--faint);margin-top:3px}
.nt.new b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-left:6px;vertical-align:middle}
.pop-empty{padding:28px 20px 34px;text-align:center;color:var(--faint);font-size:13px}

.camf-pic img{width:100%;height:100%;object-fit:cover;display:block}
.camf-empty{display:none;position:absolute;inset:0;align-items:center;justify-content:center;gap:8px;color:var(--faint);font-size:13px;text-align:center;padding:12px}
.camf.none img,.camf.none .camf-box{display:none}.camf.none .camf-empty{display:flex}
.camf-box{position:absolute;border:2px solid var(--brand);background:rgba(255,139,51,.18);cursor:move;touch-action:none}
.camf-box b{position:absolute;left:16px;top:0;background:var(--brand);color:#fff;font-size:11px;padding:2px 6px;border-radius:0 0 6px 6px}
@media (max-width:700px){.camf{grid-template-columns:1fr}}
/* captions and the heading always sit over the cam, as they do in the clip */
.tp9-cap,.tp9-hook{z-index:2}.tp9 .tp9-guide{z-index:3}
.tp9-cam.real{background:transparent;border:0}
.tp9-cam.real video,.tp9-cam.real img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tp9-cam.real b{position:absolute;left:1.6cqw;top:1.6cqw;background:var(--brand);color:#fff;padding:.9cqw 1.6cqw;border-radius:1cqw;font-size:2.8cqw}
.tp9.mini .tp9-cam.real b{display:none}
.tp9-cam.real .rs{z-index:1}
/* presets, and smooth words */
.tpe-pre .tp9{max-width:none}
.tp9-cap span[data-i]{display:inline-block;transform-origin:50% 55%;will-change:transform}
.tp9-cap span.bx{-webkit-text-stroke:0;text-shadow:none}
/* lighter previews; the picker's filter; the preview video list; boxes drawn on the video */
.tp9-fill{background-size:cover;background-position:center}
.tp9-fill img{display:none}
.tpd-card{content-visibility:auto;contain-intrinsic-size:auto 360px}
.tpd-card[hidden]{display:none}
.tpd-head .seg{margin-left:12px;flex:none;display:inline-flex}
.tpd-head .seg{background:transparent;padding:0;gap:4px}.tpd-head .seg button{white-space:nowrap;justify-content:center;padding:7px 14px;flex:none}
@media (max-width:640px){.tpd-head{flex-wrap:wrap}.tpd-head .seg{order:3;margin:6px 0 0}}
.tpv-dlg{width:min(720px,calc(100vw - 24px))}
.tpv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:16px 18px;overflow:auto;max-height:60vh}
.tpv-item{display:flex;flex-direction:column;gap:6px;padding:6px;border:2px solid transparent;border-radius:12px;background:none;cursor:pointer;text-align:left;transition:border-color .15s ease,background-color .15s ease}
.tpv-item:hover{background:var(--muted)}.tpv-item.on{border-color:var(--brand);background:var(--brand-soft)}.tpv-item.busy{opacity:.7}
.tpv-th{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--muted);display:grid;place-items:center;color:var(--faint)}
.tpv-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tpv-th svg{width:22px;height:22px}
.tpv-th em{position:absolute;left:6px;top:6px;font-style:normal;font-size:10px;font-weight:800;color:#fff;background:#E11D48;border-radius:5px;padding:2px 6px}
.tpv-t{display:flex;flex-direction:column;min-width:0;padding:0 2px}.tpv-t b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tpv-t small{font-size:12px;color:var(--dim)}
.tpe-src{margin-top:4px}
.camf-box.cam{border-color:#7C3AED;background:rgba(124,58,237,.2)}.camf-box.cam b{background:#7C3AED}
.tpe-sec .seg button svg{width:14px;height:14px;margin-right:4px;vertical-align:-2px}
/* the Style chip */
.tpc-btn .pv small{font-size:11px;font-weight:600;color:var(--faint);margin-right:5px}
.tpc-btn .tpm{width:18px}
.tpc-pop{position:fixed;z-index:60;width:200px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;pointer-events:none}
.tpc-pop .tp9{border-radius:10px}
.tpc-pop span{display:flex;flex-direction:column;padding:7px 4px 2px;font-size:12px;color:var(--dim)}.tpc-pop span b{font-size:13px;color:var(--text)}
/* presets: one row, set apart */
.tpe-presets{--pc:#E8F1FF;--pi:#1D4ED8;min-width:0;background:var(--pc);border-radius:14px;padding:12px 12px 10px;border-bottom:0}
.tpe-presets h4{color:var(--pi)}
/* each tab's presets in a colour of its own: captions blue, heading pink, layout green */
.tpe-presets.heading{--pc:#FDECF4;--pi:#BE185D}.tpe-presets.layout{--pc:#E7F7EE;--pi:#15803D}
.tpe-r{min-width:0}
.tpe-pre{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tpe-pre::-webkit-scrollbar{display:none}
.tpe-pre .tpe-opt{flex:0 0 132px;background:#fff;border-color:transparent;user-select:none}
.tpe-pre .tpe-opt.on{border-color:var(--pi);background:#fff;box-shadow:none}
.tpe-pre .tpe-opt em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tpe-opt{user-select:none}
.hps{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:6px;background-size:cover;background-position:center}
.hps span{font-size:15px;line-height:1.15;padding:4px 7px;border-radius:6px;white-space:nowrap}
.sty-page{max-width:none}
.sty-page .tpl-sec{border-bottom:0}
/* boxes drawn on the video: the dashed part is exactly what the clip shows */
.camf-box .fit{position:absolute;border:2px dashed #fff;outline:1px solid rgba(0,0,0,.35);pointer-events:none;box-sizing:border-box}
.tpe-gap{margin-top:12px}
.tpe-src{margin-top:8px}
/* the video in the editor's preview */
.tp9 [data-pick=video]{cursor:pointer}
.tp9 [data-pick=video]::after{content:attr(data-name);position:absolute;left:3cqw;top:3cqw;font:700 11px/1 system-ui,sans-serif;color:#fff;background:var(--brand);padding:4px 7px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s ease}
.tp9 [data-pick=video]:hover::after,.tp9.f-video [data-pick=video]::after{opacity:1}
.tp9 [data-pick=video]:hover,.tp9.f-video [data-pick=video]{outline:1px dashed rgba(255,255,255,.9);outline-offset:-6px}
.tp9.f-video .tp9-cam{outline:1px dashed rgba(255,255,255,.9);outline-offset:-5px}
.tpe-sec.flash{animation:secFlash 1.2s ease}
@keyframes secFlash{0%,40%{background:#E7F7EE}100%{background:transparent}}
.camf-box.ro{cursor:default}
.tpe-ai{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tp9.cps{aspect-ratio:1;border-radius:8px;background-size:cover;background-position:center}
.tp9.cps .tp9-cap{left:4%;right:4%}
/* schedule cards, compact: time and status across the top, then the picture beside the title and where it goes */
.sch-card.sch-card{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;row-gap:3px;padding:5px;border:1px solid var(--line-2);border-radius:9px;background:#fff}
.sch-card.sch-card:hover{border-color:#CDBFB5}
.sch-card .sch-cm{display:contents}
.sch-card .sch-ct{grid-column:1/-1;grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.sch-card .sch-ct time{font-size:11.5px;white-space:nowrap}
.sch-card .sch-ct em{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.sch-card .sch-ct em::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.sch-card .sch-ct em:has(.cw-spin)::before{display:none}
.sch-card img,.sch-card .noimg{grid-column:1;grid-row:2;width:24px;height:42px;border-radius:4px}
.sch-card .sch-cb{grid-column:2;grid-row:2;gap:3px;min-width:0}
.sch-card .sch-cn{-webkit-line-clamp:2;font-size:11px;line-height:1.25}
.sch-card.ok,.sch-card.bad,.sch-card.warn,.sch-card.run{background:#fff}
.sch-card .sch-pbs{margin-top:auto}
.sch-wc.today{box-shadow:none}
/* the streamer's bar: its settings panel */
.campbar .cb-opt{height:38px;width:38px;border:1px solid var(--line);border-radius:999px;background:#fff}
.campbar .cb-opt[aria-expanded=true]{border-color:var(--brand);background:var(--brand-soft)}
.cb-panel{margin:-8px auto 18px;max-width:900px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--muted)}
.cb-panel .og{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cb-panel .ob.wide{grid-column:1/-1}
.cb-panel .ob{background:#fff;border-radius:12px;padding:12px}
.cb-panel .cb-save{display:flex;flex-direction:column;justify-content:space-between;gap:8px}.cb-panel .cb-save .help{margin:0;font-size:12.5px}
.cb-panel .cb-save .btn{align-self:flex-end}
@media (max-width:640px){.cb-panel .og{grid-template-columns:1fr}}
.composer-bar #goBtn{margin-left:auto}.composer-bar .chip-ic+#goBtn{margin-left:2px}
.lang-sel{position:relative;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s ease}
.lang-sel:hover{border-color:var(--brand)}.lang-sel svg{width:16px;height:16px;color:var(--dim);flex:none}
.lang-sel select{flex:1;appearance:none;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;outline:none;min-width:0}
.hq-note{display:flex;align-items:center;gap:7px;margin:8px 4px 0;font-size:12.5px;color:var(--dim)}
.hq-note[hidden]{display:none}.hq-note svg{width:14px;height:14px;color:var(--brand-deep);flex:none}
/* the cam's own corners and border (the border drawn over the picture, inside the box, as in the clip) */
.tp9-cam.styled{border:0}
.tp9-cam.styled::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--cb,none);z-index:1;pointer-events:none}
/* the cam's picture fills its box a hair past the edge, so no gap shows between it and a rounded edge or border */
.tp9-cam.real video,.tp9-cam.real img{inset:-2%;width:104%;height:104%}
</style>
</head>

const STARTING = new Map();
function startingJob(c) {
  const fj = {id: "starting-" + c.id, kind: "live", status: "running", stage: "Starting the recording: finding the stream", progress: 0.03,
              title: c.name, uploader: "", creator: c.id, clips: [], source: {type: "url", name: c.name}, ai: {}, options: {}, created: Date.now() / 1000};
  STARTING.set(c.id, {job: fj, at: Date.now()});
  S.jobs = [fj, ...S.jobs.filter(x => x.id !== fj.id)];
  render();
}
function startedJob(c, j) {
  STARTING.delete(c.id);
  S.jobs = S.jobs.filter(x => x.id !== "starting-" + c.id);
  if (j?.id) { c.live_job = j.id; if (!jobOf(j.id)) S.jobs.unshift(j); }
  render();
}
const PENDING = new Map();          // videos just sent, shown at once until the server's own entry arrives
function keepStarting(jobs) {        // after a refresh from the server: keep the placeholder until its recording is there
  for (const [id, j] of PENDING) if (!jobs.some(x => x.id === id)) jobs.unshift(j);
  for (const [cid, s] of STARTING) {
    if (jobs.some(x => x.creator === cid && x.kind === "live" && x.status !== "done" && x.status !== "error") || Date.now() - s.at > 180000) STARTING.delete(cid);
    else if (!jobs.some(x => x.id === s.job.id)) jobs.unshift(s.job);
  }
  return jobs;
}

const DRAFTS = {};

const isChannel = u => /^(https?:\/\/)?(www\.)?(twitch\.tv|kick\.com)\/[A-Za-z0-9_]+\/?$/.test(u) || /youtube\.com\/(@[^/]+|channel\/[^/]+)\/?(live|videos|streams)?\/?$/.test(u);

function pickLink(raw) {

async function lookUp(u) {

  const l = {id: newId(), url: u, state: "wait"};

// Upload progress only touches the row's percent and bar. Redrawing the list here rebuilt the video preview
// many times a second, each one loading the whole file again, until the browser (and the computer) froze.
function paintUp(f) {
  const row = document.querySelector(`#attIn [data-row="${f.id}"]`);
  const tag = row?.querySelector(".ok.up"), bar = row?.querySelector(".pbar");
  if (!tag || !bar) return drawAtt();

  if (tag.textContent !== t) tag.textContent = t;
  const go = $("#goBtn");     // the button says how far the upload is too
  if (go && go.disabled) go.innerHTML = `<i class="cw-spin"></i>${f.pct < 100 ? `Uploading ${f.pct}%` : "Starting…"}`;

// A big file goes in pieces (anything standing in front of the app refuses one huge request), two at a time,
// and a piece that fails is simply sent again. The bar shows the whole file.
async function sendBig(f, who, opts = jobOptions()) {
  const file = f.file;
  const s = await send("/api/upload/start", {name: file.name, size: file.size, options: opts, creator: who});
  const sent = new Array(s.parts).fill(0);
  const show = () => { f.pct = Math.min(99, Math.round(sent.reduce((a, b) => a + b, 0) / file.size * 100)); paintUp(f); };
  const put = i => new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/upload/${s.id}/${i}`);
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { sent[i] = e.loaded; show(); };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) { sent[i] = Math.min(s.part, file.size - i * s.part); show(); return ok(); }
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      const err = new Error(typeof d === "string" ? d : "Upload failed"); err.final = x.status >= 400 && x.status < 500 && x.status !== 408 && x.status !== 429; fail(err);
    };
    x.onerror = x.ontimeout = () => fail(new Error("Upload failed. Check your connection."));
    x.send(file.slice(i * s.part, Math.min(file.size, (i + 1) * s.part)));
  });

  const worker = async () => {
    while (next < s.parts) {
      const i = next++;
      for (let tries = 0; ; tries++) {
        try { await put(i); break; }
        catch (e) { sent[i] = 0; if (e.final || tries >= 3) throw e; await new Promise(r => setTimeout(r, 1500 * (tries + 1))); }
      }
    }
  };
  try {
    await Promise.all([worker(), worker()]);
    await send(`/api/upload/${s.id}/finish`, {});
    f.pct = 100; drawAtt();
  } catch (e) {
    next = s.parts;                                   // stop the other sender
    api(`/api/upload/${s.id}`, {method: "DELETE"}).catch(() => {});
    throw e;
  }
}
function sendFile(f, who, opts = jobOptions()) {

    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) return ok();
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}

}

    <b>${esc(sp.label)} needs its speech model first.</b> ${admin ? `It's about ${esc(sp.size_mb)} MB and is downloaded once. Your videos start as soon as it's here.` : `Ask your admin to add ${esc(sp.label)} in Settings → Speech models.`}

async function makeClips() {      // never leaves the button stuck: anything unexpected puts it back and says so

async function makeClipsRun() {

  if (A.links.some(l => l.state === "wait")) {   // still looking a link up: start as soon as it is found
    A.queued = true; drawAtt();
    toast("Finding the video first. Clipping starts as soon as it's found.");
    return;
  }
  if (!canGo(A)) {

    $("#url")?.focus();

    const sc = $("main"); if (!el || !sc) return;
    if (el === $("section[data-job]")) return sc.scrollTo({top: 0, behavior: "smooth"});
    const r = el.getBoundingClientRect();

    clips: [], options: opts, source: {type: "url", name}, title: "", campaign: opts.campaign || "", ...extra}; PENDING.set(j.id, j); S.jobs.unshift(j); return j; };
  const links2 = links.map(l => ({l, ph: hold(l.url, {title: l.info?.title || "", uploader: l.info?.uploader || "", duration: l.info?.duration || 0, thumbUrl: l.info?.thumb || ""})}));
  const fname = f => f.file?.name || f.name || "Video";
  const files2 = files.map(f => ({f, ph: hold(fname(f), {title: fname(f).replace(/\.[^.]+$/, ""), source: {type: "file", name: fname(f)}, stage: "Uploading"})}));

    // the card stays where it was on the screen when the real video replaces the placeholder
    const el = j?.id && $(`section[data-job="${j.id}"]`); if (el && at != null && Math.abs(at) < innerHeight) $("main")?.scrollBy({top: el.getBoundingClientRect().top - at});
  };
  for (const {l, ph} of links2) {
    l.sending = true; drawAtt();
    try { const j = await send("/api/jobs", {url: l.url, options: opts, creator: who}); l.state = "done"; started++; done(ph, j); }
    catch (e) { l.state = "bad"; l.msg = e.message; failed++; done(ph); }
    l.sending = false; drawAtt();
  }
  for (const {f, ph} of files2) {
    f.state = "up"; f.pct = 0; drawAtt();
    const up = setInterval(() => { ph.progress = Math.max(0.01, (f.pct || 0) / 100 * 0.08); ph.stage = `Uploading ${Math.round(f.pct || 0)}%`; }, 300);
    try { await sendFile(f, who, opts); f.state = "done"; started++; clearInterval(up); ph.stage = "Starting"; await tick(); done(ph); }
    catch (e) { clearInterval(up); f.state = "error"; f.err = e.message; failed++; done(ph); }

    tick();
  } else if (failed) {
    // say why right here: people missed the small reason on the video and reported "not working" instead
    const why = [...A.links.filter(l => l.state === "bad").map(l => l.msg), ...A.files.filter(f => f.state === "error").map(f => f.err)].filter(Boolean);
    toast(why.length ? `Couldn't start: ${why[0]}${why.length > 1 ? ` (and ${why.length - 1} more)` : ""}` : "Nothing was started. Check the video below for the reason.", "bad");
  }

  let list = cid ? S.jobs.filter(j => j.creator === cid) : S.jobs;
  const liveBox = $("#live");
  if (liveBox) { const lj = list.find(j => j.status === "live");
    if (!lj) put(liveBox, "");
    else if (!liveBox.querySelector(".pick.open")) putJob(liveBox, lj);  // don't redraw under an open menu
    list = list.filter(j => j.status !== "live"); }
  if (!list.length) {
    root.querySelectorAll("section").forEach(e => e.remove());
    if (!$(".empty", root)) root.innerHTML = `<div class="empty"><img src="/brand/favicon.svg?v=2" alt=""><b>${cid ? "No clips for this streamer yet" : "No videos yet"}</b>${cid ? "Start recording their stream, or paste a link to one of their videos above." : "Paste a link above and the studio will find the best moments and turn them into clips."}</div>`;
    return;
  }
  $(".empty", root)?.remove();
  const ids = new Set(list.map(j => j.id));
  $$("section[data-job]", root).forEach(el => { if (!ids.has(el.dataset.job)) el.remove(); });
  list.forEach((j, i) => {
    let el = $(`section[data-job="${j.id}"]`, root);
    if (!el) { el = document.createElement("section"); el.className = "job"; el.dataset.job = j.id; }
    if (root.children[i] !== el) root.insertBefore(el, root.children[i] || null);
    putJob(el, j);
  });
}

function tokenChart(daily) {
  const W = 1000, H = 220, pl = 64, pb = 26, pt = 10, n = daily.length, ch = H - pt - pb;

  for (let i = 0; i <= 3; i++) { const v = top * i / 3; g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmtK(Math.round(v))}</text>`; }
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.tokens.toLocaleString()} tokens in ${d.calls} call${d.calls === 1 ? "" : "s"}</title><rect class="b1" x="${cx - bw / 2}" y="${y(d.tokens)}" width="${bw}" height="${Math.max(0, ch * d.tokens / top)}" rx="3"/></g>`;
    if ((n - 1 - i) % 5 === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.tokens) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No AI used in the last 30 days</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="AI tokens used per day, last 30 days">${g}${none}</svg>`;
}
