      const p = schFind(d.id); if (!p) return;
      schCloseDlg();
      const at = await pickTime("Change the time", `${p.title} · ${APPS_BAR[p.platform]?.[0] || ""} · ${p.account_name}`, p.at, "Move post");
      return at && schMove(d.id, at);
    }
    if (a === "schnow" || a === "schcancel" || a === "schretry") {
      const p = schFind(d.id); if (!p) return;
      schCloseDlg();
      const plat = APPS_BAR[p.platform]?.[0] || "";
      if (a === "schnow" && !await ask("Post now?", `${p.title} goes to ${plat} (${p.account_name}) straight away.`, "Post now")) return;
      if (a === "schcancel" && !await ask("Cancel this post?", `${p.title} will not go to ${plat}. You can post it again later.`, "Cancel post", true)) return;
      await api(`/api/posts/${d.id}/${{schnow: "now", schcancel: "cancel", schretry: "retry"}[a]}`, {method: "POST"});
      toast(a === "schcancel" ? "Post cancelled" : "Posting now. It shows as Posted once it's up.", "ok");
      S.status.waiting_posts = Math.max(0, (S.status.waiting_posts || 0) + (a === "schcancel" ? -1 : a === "schretry" ? 1 : 0)); drawShell();
      return loadSchedule();
    }
    if (a === "pause") { await send("/api/settings", {paused:!S.overview.paused}, "PUT"); return loadOverview(); }
    if (a === "pcancel" || a === "pretry") { await api(`/api/posts/${d.id}/${a === "pcancel" ? "cancel" : "retry"}`, {method:"POST"}); return S.view === "schedule" ? loadSchedule() : loadOverview(); }
    if (a === "ssave") { await saveSettings(); toast("Saved", "ok"); return drawSettings(); }
    if (a === "plansave") {
      const p = {}; $$("#sform [data-plan]").forEach(i => { (p[i.dataset.plan] ??= {})[i.dataset.f] = Number(i.value); });
      await send("/api/settings", {plans:p}, "PUT"); S.status = await api("/api/status"); toast("Plans saved", "ok"); return drawSettings();
    }
    if (a === "testalert") { await saveSettings(); await api("/api/alerts/test", {method:"POST"}); return toast("Test message sent. Check your phone.", "ok"); }
    if (a === "accremove") {
      if (!await ask("Disconnect this account?", "Posts still waiting for it will fail.", "Disconnect", true)) return;
      await api(`/api/accounts/${d.id}`, {method:"DELETE"}); await tick(); return drawSettings();
    }
    if (a === "cdview") return cdView(d.k);
    if (a === "cdset") return cdEdit(d.f, d.v);
    if (a === "cdnudge") { const j = jobOf(D.jid), c = j?.clips.find(x => x.id === D.cid); return cdEdit(d.k, Math.max(0, Math.round((Number(cdVal(c, d.k)) + Number(d.d)) * 10) / 10)); }
    if (a === "cddiscard") { D.draft = {}; const i = $("#clipdlg [data-hk]"); const c0 = jobOf(D.jid)?.clips.find(x => x.id === D.cid); if (i && c0) i.value = c0.hook; cdPaint(); cdSave("draft"); return cdView("video"); }
    if (a === "cdupdate" || a === "cdcopy") {
      const j = jobOf(D.jid), c = j?.clips.find(x => x.id === D.cid), body = {};
      ["hook", "style", "layout", "start", "end"].forEach(k => body[k] = cdVal(c, k));
      if (a === "cdupdate") { await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body); toast("Updating the video. Posts wait for the new version.", "ok"); D.draft = {}; await tick(); return drawClipDlg(true); }
      const r = await send(`/api/jobs/${D.jid}/clips/${D.cid}/copy`, body); D.draft = {}; await send(`/api/jobs/${D.jid}/clips/${D.cid}`, {draft: {}}, "PATCH");
      toast("Making a new clip. This one stays as it is.", "ok"); await tick(); if (r?.clip) { D.cid = r.clip; drawClipDlg(true); } return;
    }
    if (a === "cpnow") { await send(`/api/posts/${d.id}/${Object.values(jobOf(D.jid)?.clips.find(x => x.id === D.cid)?.posts || {}).length && (jobOf(D.jid).clips.find(x => x.id === D.cid).posts[d.id] || {}).status === "failed" ? "retry" : "now"}`, {}); toast("Trying again now", "ok"); return tick(); }
    if (a === "cpstop") { if (!await ask("Cancel this post?", "It won't be tried again.", "Cancel post", true)) return; await send(`/api/posts/${d.id}/cancel`, {}); toast("Post cancelled", "ok"); return tick(); }
    if (a === "cdtab") { D.tab = d.k; $$("#clipdlg [data-pane]").forEach(x => x.hidden = x.dataset.pane !== d.k); $$("#clipdlg .ce-tabs button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.k === d.k))); return; }
    if (a === "cdwhen") { D.when = d.k; $("#cdlater").hidden = d.k !== "later"; $$("#clipdlg .ce-when button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.k === d.k))); if (d.k === "later") schTp(); return cdLabel(); }
    if (a === "cdday") { S.schAdd.t = +d.t; cdCal(); return schTp(); }
    if (a === "cdcalm") { const x = new Date(D.cal); D.cal = new Date(x.getFullYear(), x.getMonth() + +d.n, 1).getTime(); return cdCal(); }
    if (a === "cdpick") { $(`#clipdlg input[data-f="${d.f}"]`).value = d.v; $$(`#clipdlg [data-pick="${d.f}"] button`).forEach(x => { const on = x.dataset.v === d.v; x.classList.toggle("on", on); x.setAttribute("aria-pressed", String(on)); }); return; }
    if (a === "cdstep") { const i = $(`#clipdlg input[data-f="${d.k}"]`); i.value = Math.max(0, Math.round((Number(i.value) + Number(d.d)) * 10) / 10);
      const l = Number($('#clipdlg input[data-f="end"]').value) - Number($('#clipdlg input[data-f="start"]').value); $("#cdlen").textContent = fmt(Math.max(0, l)); return; }
    if (a === "cdcamp") { $("#clipdlg").close(); S.campOpen = d.k; return go("c:" + d.c, "campaign"); }
    if (a === "cdtext") {
      const body = {}; $$("#clipdlg [data-t]").forEach(i => body[i.dataset.f] = i.value);
      await send(`/api/jobs/${D.jid}/clips/${D.cid}`, body, "PATCH"); toast("Text saved", "ok"); return tick();
    }
    if (a === "cdcopy") {
      const body = {}; $$("#clipdlg [data-f]").forEach(i => body[i.dataset.f] = i.type === "number" ? Number(i.value) : i.value);
      const r = await send(`/api/jobs/${D.jid}/clips/${D.cid}/copy`, body); toast("Making a new clip. This one stays as it is.", "ok");
      await tick(); if (r?.clip) { D.cid = r.clip; D.tab = "post"; drawClipDlg(true); } return;
    }
    if (a === "cdgo") {
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Pick where to post it.", "bad");
      if (D.when === "now") {
        if (!await ask("Post now?", `This clip goes to ${accs.length} account${accs.length > 1 ? "s" : ""} straight away.`, "Post now")) return;
        await send("/api/posts", {job: D.jid, clip: D.cid, accounts: accs, now: true}); toast("Posting now. It shows as Posted once it's up.", "ok");
      } else {
        const x = S.schAdd, dt = new Date(x.t); dt.setHours(x.h, x.m, 0, 0);
        const r = await send("/api/posts", {job: D.jid, clip: D.cid, accounts: accs, at: dt.getTime() / 1000, day: x.t / 1000});
        S.status.waiting_posts = (S.status.waiting_posts || 0) + (r?.queued || 0); drawShell();
        toast(r?.paused ? `Scheduled for ${when(dt.getTime() / 1000)}, but posting is paused.` : `Scheduled for ${when(dt.getTime() / 1000)}`, r?.paused ? "" : "ok");
      }
      return tick();
    }
    if (a === "remake") {
      const body = {}; $$("#clipdlg [data-f]").forEach(i => {
        body[i.dataset.f] = i.type === "checkbox" ? i.checked : i.type === "number" ? Number(i.value) : i.value;
      });
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body); toast("Re-making the clip…", "ok"); return tick();
    }
    if (a === "writetext") {
      b.disabled = true; const was = b.textContent; b.textContent = "Writing…";
      try {
        const t = await send(`/api/jobs/${D.jid}/clips/${D.cid}/write`, {});
        const f = k => $(`#clipdlg [data-tx="${k}"]`);
        f("title").value = t.title; f("description").value = t.description; f("hashtags").value = (t.hashtags || []).map(h => "#" + h).join(" ");
        cdSave("text");
        return toast("New post text written. Read it over: it is saved as it is.", "ok");
      } finally { b.disabled = false; b.textContent = was; }
    }
    if (a === "postat") {
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Tick at least one account first.", "bad");
      const at = await pickTime("Schedule this clip", `It goes to ${accs.length} account${accs.length > 1 ? "s" : ""} at the time you pick.`, null, "Schedule");
      if (!at) return;
      const r = await send("/api/posts", {job:D.jid, clip:D.cid, accounts:accs, at});
      S.status.waiting_posts = (S.status.waiting_posts || 0) + (r?.queued || 0); drawShell();
      toast(r?.paused ? `Scheduled for ${when(at)}, but posting is paused. Resume it on the Schedule page.` : `Scheduled for ${when(at)}. See it on the Schedule page.`, r?.paused ? "" : "ok");
      return tick();
    }
    if (a === "postnow" || a === "postqueue") {
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Tick at least one account first.", "bad");
      if (a === "postnow" && !await ask("Post now?", `This clip goes to ${accs.length} account${accs.length > 1 ? "s" : ""} straight away.`, "Post now")) return;
      const r = await send("/api/posts", {job:D.jid, clip:D.cid, accounts:accs, now:a === "postnow"});
      toast(a === "postnow" ? "Posting now. It shows as Posted on the clip once it's up."
        : r?.paused ? "Added to the queue, but posting is paused. It goes out once you press Resume posting on Home." : "Added to the queue", r?.paused && a !== "postnow" ? "" : "ok");
      return tick();
    }
  } catch (err) { b.disabled = false; toast(err.message, "bad"); }
});

$("#collapseBtn").innerHTML = ic("sidebar"); $("#menuBtn").innerHTML = ic("menu");
try { if (localStorage.getItem("mini")) $("#app").classList.add("mini"); } catch {}
$("#main").addEventListener("scroll", () => $(".topbar").classList.toggle("stuck", $("#main").scrollTop > 4), {passive:true});
(async () => {
  try { S.status = await api("/api/status"); } catch {}
  setInterval(async () => { try { S.status = await api("/api/status"); drawShell(); } catch {} }, 60000);   // clip balance
  const q = new URLSearchParams(location.search);
  if (q.get("connected") || q.get("connect_error")) {
    const ok = q.get("connected"), err = q.get("connect_error"), nm = q.get("name");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`${nm || ok} is connected. Pick it in a streamer's Setup to post there.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("verified")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Email confirmed. You're ready to clip.", "ok"), 300); }
  if (q.get("verify_error")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast(q.get("verify_error"), "bad"), 300); }
  if (location.pathname.startsWith("/app/")) { const [v, tab] = fromPath(location.pathname); S.view = v; S.ctab = tab; }  // the address decides, before anything loads
  await tick();
  { const [v, tab] = location.pathname.startsWith("/app/") ? fromPath(location.pathname) : ["overview", "clips"]; go(v, tab, true); remember(S.view, S.ctab, "replace"); }
  try {  // a link pasted on the home page before signing up
    const link = sessionStorage.getItem("peakcut_link");
    if (link) { sessionStorage.removeItem("peakcut_link"); go("overview"); $("#url").value = link; onLink($("#url")); $("#url").focus(); toast("Your link is ready. Press Make clips.", "ok"); }
  } catch {}
  loop();
  const firstTour = () => { if (S.status.tour && !$("#formdlg").open) setTimeout(startTour, 400); };   // once, the first time someone signs in
  // On opening: what's new first, once per release; once it is closed, the tour for new accounts
  setTimeout(() => whatsNewOnce(false, firstTour), 700);
  checkNew(true);
  if (!S.cp.rows) loadCampaigns();          // for the count beside Campaigns in the sidebar
  Promise.all([loadMyCamps(), loadTpls()]).then(() => { drawShell(); drawCampBar(); if (S.view === "campaigns") drawCampView(); if (creator() && S.ctab === "campaign") drawCreatorForm(); if ($("#add")) drawAdd(S.view === "overview" ? "hero" : "compact"); });
  setInterval(async () => { try { S.status = await api("/api/status"); drawShell(); if (S.view === "overview") drawOverview(); checkNew(); checkRelease(); } catch {} }, 15000);
  setInterval(() => { if (S.view === "schedule" && !document.hidden && !$("#formdlg").open && !$("#schdlg").open) loadSchedule(); }, 30000);   // posts going out, views coming in
  if (S.view !== "overview" && S.view !== "discover") Promise.all([loadFamous(), loadLive()]).then(drawShell);
  setInterval(() => { if (!document.hidden && S.view !== "overview" && S.view !== "discover") Promise.all([loadFamous(), loadLive()]).then(drawShell); }, 180000);
})();
</script>
