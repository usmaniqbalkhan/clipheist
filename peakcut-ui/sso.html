<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening ClipHeist</title>
<link rel="icon" href="/brand/favicon.svg?v=2" type="image/svg+xml">
<style>
  :root { --brand:#fffa8d; --ink:#0b0b0b; --muted:#6b6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#fff; color:var(--ink);
         font:16px/1.5 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .card { text-align:center; padding:32px 16px; }
  .logo { display:inline-flex; align-items:center; gap:10px; font:700 28px/1 Oswald, Inter, sans-serif; letter-spacing:-.5px; }
  .logo img { width:34px; height:34px; }
  .spin { width:34px; height:34px; margin:28px auto 14px; border:3px solid #eee; border-top-color:var(--ink);
          border-radius:50%; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  p { color:var(--muted); margin:0; }
  a.btn { display:inline-block; margin-top:18px; padding:12px 22px; border-radius:999px; background:var(--ink);
          color:var(--brand); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="/brand/favicon.svg?v=2" alt="">ClipHeist</div>
  <div class="spin" id="spin"></div>
  <p id="msg">Opening your clips…</p>
</div>
<script>
(async () => {
  const SITE = "https://clipheist.site";
  const h = new URLSearchParams(location.hash.slice(1));
  const token = h.get("t") || "";
  let next = h.get("next") || "/app";
  if (!next.startsWith("/") || next.startsWith("//")) next = "/app";
  history.replaceState(null, "", "/sso");           // the token never stays in the address bar or history
  const fail = (text) => {
    document.getElementById("spin").remove();
    const m = document.getElementById("msg");
    m.textContent = text;
    const a = document.createElement("a");
    a.className = "btn"; a.href = SITE + "/start"; a.textContent = "Sign in again";
    m.after(a);
  };
  if (!token) { location.replace(SITE + "/start"); return; }
  try {
    const r = await fetch("/api/auth/supabase", { method: "POST", headers: { "content-type": "application/json" },
                                                 body: JSON.stringify({ access_token: token }) });
    if (r.ok) { location.replace(next); return; }
    const j = await r.json().catch(() => ({}));
    fail(j.detail || "Sign-in did not go through.");
  } catch (e) {
    fail("Could not reach ClipHeist. Check your connection.");
  }
})();
</script>
</body>
</html>
